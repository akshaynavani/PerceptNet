# Smoke-test config: trains on generated shapes, runs on CPU in minutes.
data:
  kind: synthetic
  class_names: [car, pedestrian, cyclist]
  input_size: [256, 256]
  batch_size: 16
  synthetic_train_size: 2000
  synthetic_val_size: 200
model:
  backbone: resnet18
train:
  epochs: 10
  lr: 0.001
  warmup_steps: 200
  output_dir: runs/synthetic
inference:
  score_threshold: 0.3
