[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perceptnet"
version = "0.1.0"
description = "Autonomous perception pipeline: JAX/XLA object detection with OpenCV preprocessing and C++ kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akshay Navani" }]
dependencies = [
    "jax>=0.4.30",
    "flax>=0.8.5",
    "optax>=0.2.2",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
gpu = ["jax[cuda12]>=0.4.30"]
cpp = ["pybind11>=2.11"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
perceptnet = "perceptnet.cli:main"

[tool.setuptools.packages.find]
include = ["perceptnet*"]

[tool.setuptools.package-data]
perceptnet = ["ops/*.so", "ops/*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: end-to-end training smoke tests (run with -m slow)"]

[tool.ruff]
line-length = 100
target-version = "py310"
